# Public preview on GitHub Pages with the REAL, approved entries from the sheet "Öffentlich".
# https://rohmerchristian-bit.github.io/aermer-ohne-uns/
#
# Rebuilt on every push, every hour and by hand ("Run workflow"). If the data step fails
# (e.g. a broken sheet formula), nothing is deployed and the previous preview stays online.
# Secret: SHEET_PUBLIC_CSV_URL (published CSV of the sheet "Öffentlich").
# The production deployment to the E-Werk server is a separate workflow (Phase 6).

name: Vorschau (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DATA_SOURCE: remote
      SHEET_PUBLIC_CSV_URL: ${{ secrets.SHEET_PUBLIC_CSV_URL }}
      PREVIEW: '1'
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Downloaded originals and optimised images, so Drive is not asked again every hour.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/images
            public/media
          key: images-${{ github.run_id }}
          restore-keys: images-

      - run: npm test

      - name: Typprüfung
        run: npm run check

      - name: Website bauen (echte Daten)
        run: npm run build

      # GitHub Pages cannot protect folders with a password: the internal tools stay off the preview.
      - name: Interne Werkzeuge entfernen
        run: rm -rf dist/intern

      - name: Zusammenfassung
        run: |
          echo "### Vorschau gebaut" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./.cache/build-report.json"); console.log(r.summary)' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
