# #ÄrmerOhneUns – nginx-Gegenstück zu public/.htaccess (nur falls die Seite einmal auf nginx umzieht).

server {
  listen 80;
  listen [::]:80;
  server_name aermerohneuns.de www.aermerohneuns.de;
  location /.well-known/ { root /var/www/aermerohneuns; }
  location / { return 301 https://aermerohneuns.de$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.aermerohneuns.de;
  # ssl_certificate …; ssl_certificate_key …;
  return 301 https://aermerohneuns.de$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name aermerohneuns.de;
  # ssl_certificate …; ssl_certificate_key …;

  root /var/www/aermerohneuns;   # Inhalt von dist/
  index index.html;
  charset utf-8;
  autoindex off;
  error_page 404 /404.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.cleverreach.com; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;

  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
  location ~* \.(js|css|woff2|avif|webp)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~* \.(png|jpg|svg|ico)$ { add_header Cache-Control "public, max-age=3600"; }

  # Admin-Bereich (Phase 5): Passwortschutz
  # location /admin/ { auth_basic "Admin"; auth_basic_user_file /etc/nginx/aermerohneuns.htpasswd; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
